  {id:"hernia_inguinal",match:["Plastia inguinal"],dx:"Hernia inguinal izquierda / derecha / bilateral",proc:"Plastia inguinal laparoscópica con malla",desc:"Plastia inguinal laparoscópica unilateral o bilateral con colocación de malla protésica.",ben:"Corrección del defecto herniario, alivio del dolor y prevención de incarceración o estrangulación intestinal.",alt:"Observación clínica en casos seleccionados y reparación abierta.",freq:"Dolor inguinal, hematoma, seroma, inflamación escrotal, infección, retención urinaria y recurrencia.",grave:"Lesión intestinal, vascular, vesical o del cordón espermático, dolor crónico, infección de malla, tromboembolia pulmonar, lesión testicular, reintervención e incluso muerte."},

  {id:"hemorroidectomia",match:["Hemorroidectomía"],dx:"Enfermedad hemorroidal",proc:"Hemorroidectomía",desc:"Resección quirúrgica de paquetes hemorroidales internos y/o externos.",ben:"Control de dolor, sangrado, prolapso y mejoría de síntomas anorrectales.",alt:"Manejo médico, ligadura con banda elástica, escleroterapia o coagulación infrarroja.",freq:"Dolor postoperatorio, sangrado leve, edema, retención urinaria y estreñimiento.",grave:"Hemorragia importante, infección profunda, absceso, estenosis anal, incontinencia fecal, sepsis y necesidad de reintervención."},
  {id:"absceso_anorrectal",match:["Absceso anorrectal","Exploración anal"],dx:"Absceso anorrectal",proc:"Drenaje quirúrgico de absceso anorrectal",desc:"Drenaje quirúrgico de absceso anorrectal con lavado y procedimientos adicionales según hallazgos.",ben:"Control de infección, alivio del dolor y prevención de progresión séptica.",alt:"Manejo médico temporal con antibióticos en casos seleccionados.",freq:"Dolor, sangrado leve, secreción persistente e infección local.",grave:"Fístula anal, recurrencia, extensión de infección, sepsis, lesión esfinteriana e incontinencia fecal."}
];
const RISK_OPTS = [
  ["diabetes","Diabetes mellitus","puede incrementar el riesgo de infección, cicatrización retardada, descontrol glucémico y recuperación postoperatoria más lenta"],
  ["hta","Hipertensión arterial","puede incrementar el riesgo de descontrol tensional, eventos cardiovasculares, sangrado y complicaciones anestésicas"],
  ["obesidad","Obesidad","puede aumentar la dificultad técnica, el riesgo de infección, seroma, complicaciones respiratorias, tromboembolia y recurrencia en cirugía de hernia"],
  ["tabaco","Tabaquismo","puede incrementar el riesgo de complicaciones respiratorias, infección, mala cicatrización y eventos cardiovasculares"],
  ["cardio","Cardiopatía","puede aumentar el riesgo de arritmias, isquemia, insuficiencia cardiaca, eventos cardiovasculares y complicaciones anestésicas"],
  ["pulmon","Enfermedad pulmonar / asma / EPOC","puede aumentar el riesgo de broncoespasmo, neumonía, atelectasia, dificultad ventilatoria y complicaciones anestésicas"],
  ["anticoag","Anticoagulantes o antiagregantes","puede incrementar el riesgo de sangrado, hematoma, necesidad de transfusión, ajuste de medicamentos y eventos trombóticos"],
  ["inmuno","Inmunosupresión","puede aumentar el riesgo de infección, mala cicatrización, progresión de procesos infecciosos y recuperación más lenta"],
  ["previas","Cirugías abdominales previas","pueden incrementar el riesgo de adherencias, dificultad técnica, lesión intestinal, conversión a cirugía abierta y mayor tiempo quirúrgico"],
  ["edad","Edad avanzada / fragilidad","puede aumentar el riesgo de descompensación, delirium, complicaciones cardiovasculares, pulmonares, infecciosas y recuperación prolongada"],
  ["hepatica","Alteraciones hepáticas","pueden incrementar el riesgo de sangrado, infección, descompensación metabólica y complicaciones relacionadas con la vía biliar"],
  ["renal","Enfermedad renal","puede aumentar el riesgo de alteraciones hidroelectrolíticas, ajuste de medicamentos, sangrado, infección y recuperación prolongada"],
  ["embarazo","Embarazo","puede modificar el riesgo anestésico y quirúrgico, así como requerir vigilancia materno-fetal y ajustes en medicamentos o estudios"],
  ["otro","Otra condición relevante","puede modificar el riesgo quirúrgico de acuerdo con sus características clínicas particulares"]

const HI=["08:00","07:00"], HC=["11:00","10:00","08:00","07:00"];
const COLS=["#039be5","#33b679","#e67c73","#f6bf26","#8e24aa","#0b8043","#d50000","#3f51b5"];
const PASOS=["Paciente","Fechas y Horas","Equipo","Materiales","Consentimiento","Resumen"];

// Estado global
let S = {
  paso:1, ok:false, env:false, err:"", vd:false,
  f:{pac:"",nac:"",tel:"",cor:"",proc:"",hosp:"",
     fing:"",hing:"",opfx:"1",fcxp:"",hcx:"",
     color:"#039be5",anest:"",equip:[],ins:[],insex:"",
     consentProc:"",conds:[],alergias:"",obsClin:"",apiKey:"",firmaData:"",
     consent:{desc:"",ben:"",alt:"",freq:"",grave:"",part:""}}
};
window.S=S;

// Helpers
function edad(n){if(!n)return null;const h=new Date(),b=new Date(n+"T12:00:00");let e=h.getFullYear()-b.getFullYear();const m=h.getMonth()-b.getMonth();if(m<0||(m===0&&h.getDate()<b.getDate()))e--;return e;}
function ff(s){if(!s)return"";const[y,m,d]=s.split("-");return`${d}/${m}/${y}`;}
function ofx(s,d){if(!s)return"";const dt=new Date(s+"T12:00:00");dt.setDate(dt.getDate()+d);return dt.toISOString().split("T")[0];}
function fleg(s){if(!s)return"";const[y,m,d]=s.split("-");const ms=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];return`${parseInt(d)} de ${ms[parseInt(m)-1]} de ${y}`;}
function fcx(){const f=S.f;return f.opfx==="1"?f.fing:f.opfx==="2"?ofx(f.fing,1):f.fcxp;}

// Render pasos
function rPasos(){
  document.getElementById("pasos").innerHTML=PASOS.map((p,i)=>{
    const n=i+1,a=S.paso===n,l=S.paso>n;
    return`<div class="pi${a?" a":l?" l":""}" ${l?`onclick="goP(${n})"`:""}>
      <div class="pn">${l?"✓":n}</div><div class="pl">${p}</div></div>`;
  }).join("");
}

// Render completo (solo al cambiar de paso o acciones de botón)
function render(){
  document.getElementById("pasos").style.display=S.ok?"none":"flex";
  rPasos();
  const c=document.getElementById("card");
  c.innerHTML=S.ok?rConf():rPaso();
  setTimeout(autoGrowConsent,0);
}

function rPaso(){
  let h="";
  if(S.paso===1)h=rP1();
  if(S.paso===2)h=rP2();
  if(S.paso===3)h=rP3();
  if(S.paso===4)h=rP4();
  if(S.paso===5)h=rP5();
  if(S.paso===6)h=rP6();
  return h+rNav();
}

// PASO 1 — campos con oninput inline (NO llaman a render)

    <div id="dirHint" class="hint">${f.hosp?(HOSP.find(h=>h.n===f.hosp)||{d:""}).d:"" }</div>
  </div>`;
}

// PASO 2
function rP2(){
  const f=S.f, cx=fcx(), ay=f.fing?ff(ofx(f.fing,-1)):"";
  const hiOtra = S.hiOtra || (!HI.includes(f.hing) && f.hing!=="");
  const hcOtra = S.hcOtra || (!HC.includes(f.hcx) && f.hcx!=="");

  const bhi=HI.map(h=>`<button class="hbtn${f.hing===h&&!hiOtra?" a":""}" onclick="selHI('${h}')">${h}</button>`).join("")+
    `<button class="hbtn o${hiOtra?" a":""}" onclick="selHI('otra')">Otra</button>`;
  const bhc=HC.map(h=>`<button class="hbtn${f.hcx===h&&!hcOtra?" a":""}" onclick="selHC('${h}')">${h}</button>`).join("")+
    `<button class="hbtn o${hcOtra?" a":""}" onclick="selHC('otra')">Otra</button>`;

  return`<h2>📅 Fechas y Horas</h2>
  <div style="background:#eef7ff;border-radius:9px;padding:10px 14px;margin-bottom:18px;border:1px solid #cfe6ff;font-size:13px;color:#64748b">
    <strong style="color:#0b1f3a">${f.pac}</strong> · ${f.proc}</div>
  <div class="campo"><label>Fecha de ingreso <span class="req">*</span></label>

  <div class="campo"><label>Hora de ingreso <span class="req">*</span></label>
    <div class="hbtns">${bhi}</div>
    ${hiOtra?`<input type="text" style="margin-top:8px;width:100%;padding:11px 14px;border:1.5px solid #1266ff;border-radius:8px;font-size:15px;font-family:Georgia,serif" placeholder="HH:MM" value="${!HI.includes(f.hing)?f.hing:''}" oninput="S.f.hing=this.value" maxlength="5" autofocus>`:''}
  </div>
  <div class="campo"><label>Fecha de cirugía <span class="req">*</span></label>
    <div class="fbtns">
      <button class="fbtn${f.opfx==='1'?" a":""}" onclick="S.f.opfx='1';render()">Mismo día</button>
      <button class="fbtn${f.opfx==='2'?" a":""}" onclick="S.f.opfx='2';render()">Día siguiente</button>
      <button class="fbtn${f.opfx==='3'?" a":""}" onclick="S.f.opfx='3';render()">Otra fecha</button>
    </div>
    ${f.opfx==='3'?`<input type="date" value="${f.fcxp}" onchange="S.f.fcxp=this.value;render()">`:
      cx?`<p class="hint">Fecha de cirugía: <strong>${ff(cx)}</strong></p>`:''}
  </div>
  <div class="campo"><label>Hora de cirugía <span class="req">*</span></label>
    <div class="hbtns">${bhc}</div>
    ${hcOtra?`<input type="text" style="margin-top:8px;width:100%;padding:11px 14px;border:1.5px solid #1266ff;border-radius:8px;font-size:15px;font-family:Georgia,serif" placeholder="HH:MM" value="${!HC.includes(f.hcx)?f.hcx:''}" oninput="S.f.hcx=this.value" maxlength="5" autofocus>`:''}
  </div>
  ${ay?`<div class="ayuno">Ayuno automatico: 23:30 hrs del dia ${ay} (No tomar ni agua)</div>`:''}
  <div class="campo"><label>Color Google Calendar</label>
    <div class="colores">${COLS.map(c=>`<button class="cbtn${f.color===c?" a":""}" style="background:${c}" onclick="S.f.color='${c}';render()"></button>`).join("")}</div>
  </div>`;
}

// PASO 3
function rP3(){

  const eq=EQ.filter(m=>m.r!=="Anestesiólogo").map(m=>`
    <label class="eitem${f.equip.includes(m.n)?" s":""}">

      <option value="">— Seleccione —</option>

// PASO 4
function rP4(){
  const f=S.f;

// PASO 5
function rP5(){
  const f=S.f, base=consentBase();
  if(!f.consentProc) f.consentProc=base.id;
  if(!f.consent.desc) fillConsentTemplate();
  const conds=RISK_OPTS.map(([id,lab])=>`
    <label class="cond${f.conds.includes(id)?" s":""}">
      <input type="checkbox" ${f.conds.includes(id)?"checked":""} onchange="togCond('${id}')">
      <span>${lab}</span>
    </label>`).join("");
  return`<h2>📝 Consentimiento informado</h2>
  <div class="consnote">El texto ya está generado en las cajas de abajo y puedes editarlo antes de descargar el PDF. La IA es opcional; si no pegas una API key, se usa la plantilla médica base.</div>
  <div class="consbox">
    <h3>Procedimiento para consentimiento</h3>
    <div class="campo" style="margin-bottom:0">
      <select onchange="S.f.consentProc=this.value;fillConsentTemplate();render()">
        ${CONSENT_PROCS.map(p=>`<option value="${p.id}"${base.id===p.id?" selected":""}>${p.dx} — ${p.proc}</option>`).join("")}
      </select>
    </div>
  </div>
  <div class="campo"><label>Condiciones particulares del paciente</label>
    <div class="condgrid">${conds}</div>
  </div>
  <div class="g2">
    <div class="campo"><label>Alergias</label>
      <input type="text" placeholder="Medicamentos, látex, contraste..." value="${f.alergias}" oninput="S.f.alergias=this.value"></div>
    <div class="campo"><label>Observaciones clínicas</label>
      <input type="text" placeholder="Dato relevante adicional" value="${f.obsClin}" oninput="S.f.obsClin=this.value"></div>
  </div>
  <div class="consactions">
    <button class="mini fill" onclick="useConsentTemplate()">Usar plantilla</button>
    <button class="mini" onclick="genConsentAI()">Generar con IA</button>
    <button class="mini" onclick="downloadConsentPdf()">Descargar PDF</button>
  </div>
  <div class="campo">
    <label>API key de OpenAI para IA (opcional, solo esta sesión)</label>
    <div class="keyrow">
      <input type="password" placeholder="sk-..." value="${f.apiKey}" oninput="S.f.apiKey=this.value">
      <button class="mini" onclick="S.f.apiKey='';render()">Limpiar</button>
    </div>
    <div class="hint">Si no usas IA, la plantilla médica queda editable y se puede descargar igual.</div>
  </div>
  <div class="campo">
    <label>Firma del médico</label>
    <input type="file" accept="image/png,image/jpeg" onchange="loadFirma(this)">
    <div class="hint">${f.firmaData?"Firma cargada y guardada en este navegador.":"Se usará tu firma predeterminada. Puedes cargar otra PNG/JPG si quieres cambiarla."}</div>
    <img class="firma-preview" src="${f.firmaData||window.DEFAULT_SIGNATURE_DATA_URL||""}" alt="Firma cargada">
    ${f.firmaData?`<button class="mini" style="margin-top:8px" onclick="clearFirma()">Usar firma predeterminada</button>`:""}
  </div>
  ${["desc","ben","alt","freq","grave","part"].map(k=>consTextArea(k)).join("")}
  <div class="consactions">
    <button class="mini fill" onclick="downloadConsentPdf()">Descargar PDF del consentimiento</button>
    <button class="mini" onclick="goP(6)">Ir al resumen</button>
  </div>`;
}

// PASO 6
function rP6(){
  const f=S.f, e=edad(f.nac), cx=fcx(), ay=f.fing?ff(ofx(f.fing,-1)):"";
  const secs=[
    {ic:"👤",t:"Paciente",rs:[f.pac,`${e} años · Nacido: ${ff(f.nac)}`,f.tel&&`Tel: ${f.tel}`,f.cor&&`Email: ${f.cor}`].filter(Boolean)},
    {ic:"🔪",t:"Procedimiento",rs:[f.proc,f.hosp]},
    {ic:"📅",t:"Fechas y Horas",rs:[`Ingreso: ${ff(f.fing)} a las ${f.hing} hrs`,`Cirugía: ${ff(cx)} a las ${f.hcx} hrs`,`Ayuno: 23:30 hrs del ${ay}`]},
    {ic:"👥",t:"Equipo",rs:[f.anest?`Anestesiólogo: ${f.anest}`:null,...f.equip].filter(Boolean)},
    {ic:"🧰",t:"Materiales",rs:[`${f.ins.length} insumos · en notas del calendario`]},
    {ic:"📝",t:"Consentimiento",rs:[(consentBase().dx||"")+" — "+(consentBase().proc||""),`${f.conds.length} condiciones particulares seleccionadas`]},
  ];
  return`<h2>✅ Resumen y Confirmación</h2>
  ${secs.map(s=>`<div class="rcard"><div class="rtit">${s.ic} ${s.t}</div>${s.rs.map(r=>`<div class="rfila">${r}</div>`).join("")}</div>`).join("")}
  <p style="font-size:11px;font-weight:700;color:#1266ff;text-transform:uppercase;letter-spacing:0.07em;margin:16px 0 10px">📄 Vista previa — Indicaciones de Ingreso</p>
  ${rDoc()}
  <div class="aviso">⚡ Al confirmar: Google Calendar + invitaciones + Google Sheets + indicaciones por correo.</div>`;
}

function consentBase(){
  const byId=CONSENT_PROCS.find(p=>p.id===S.f.consentProc);
  if(byId)return byId;
  return CONSENT_PROCS.find(p=>p.match.some(m=>S.f.proc.includes(m))) || CONSENT_PROCS[0];
}
function selectedRiskText(){
  const parts=S.f.conds.map(id=>(RISK_OPTS.find(x=>x[0]===id)||[])[2]).filter(Boolean);
  const extras=[S.f.alergias&&`alergias referidas: ${S.f.alergias}`,S.f.obsClin].filter(Boolean);
  if(!parts.length && !extras.length)return"De acuerdo con las condiciones particulares conocidas del paciente, pueden presentarse riesgos adicionales no previsibles en su totalidad y relacionados con su estado clínico al momento de la cirugía.";
  return`En virtud de las condiciones particulares del paciente, ${[...parts,...extras].join("; ")}.`;
}
function fillConsentTemplate(){
  const b=consentBase();
  S.f.consentProc=b.id;
  S.f.consent={desc:b.desc,ben:b.ben,alt:b.alt,freq:b.freq,grave:b.grave,part:selectedRiskText()};
}
function useConsentTemplate(){S.err="";fillConsentTemplate();render();}
function consTextArea(k){
  const labels={desc:"El procedimiento consiste en",ben:"Beneficios",alt:"Alternativas de tratamiento",freq:"Riesgos típicos más frecuentes",grave:"Riesgos graves menos frecuentes",part:"Riesgos particulares del paciente"};
  const v=(S.f.consent&&S.f.consent[k])||"";
  return`<div class="campo"><label>${labels[k]}</label>
    <textarea class="consarea" oninput="S.f.consent.${k}=this.value;autoGrowOne(this)">${v}</textarea></div>`;
}
function autoGrowOne(el){el.style.height="auto";el.style.height=(el.scrollHeight+4)+"px";}
function autoGrowConsent(){document.querySelectorAll("textarea.consarea").forEach(autoGrowOne);}

// NAV
function rNav(){
  const v=valid(), u=S.paso===6;
  const ba=S.paso>1?`<button class="bs" onclick="goP(${S.paso-1})">← Anterior</button>`:`<button class="bs inv">←</button>`;
  const bs=u?`<button class="bp bconf" onclick="conf()" ${S.env?"disabled":""}>${S.env?"⏳ Procesando...":"✅ Confirmar Cirugía"}</button>`:
    `<button class="bp" onclick="goP(${S.paso+1})" ${!v?"disabled":""}">Siguiente →</button>`;
  return`<div class="nav">${ba}<span class="nc">${S.paso} de 6</span>${bs}</div>
  ${S.err?`<div class="errbox">❌ ${S.err}</div>`:""}`;
}

function valid(){
  const f=S.f;
  if(S.paso===1)return f.pac&&f.nac&&f.proc&&f.hosp;
  if(S.paso===2)return f.fing&&f.hing&&f.hcx&&(f.opfx!=="3"||f.fcxp);
  if(S.paso===5)return f.consent.desc&&f.consent.ben&&f.consent.alt&&f.consent.freq&&f.consent.grave&&f.consent.part;
  return true;
}

function loadFirma(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    S.f.firmaData=reader.result;
    try{localStorage.setItem("firmaMedicoPabloVidal",S.f.firmaData);}catch(e){}
    render();
  };
  reader.readAsDataURL(file);
}
function clearFirma(){
  S.f.firmaData="";
  try{localStorage.removeItem("firmaMedicoPabloVidal");}catch(e){}
  render();
}

async function genConsentAI(){
  if(!S.f.apiKey){S.err="Para usar IA pega tu API key. Mientras tanto, el texto de plantilla ya está generado y editable.";render();return;}
  S.env=true;S.err="";render();
  try{
    const b=consentBase();
    const conds=S.f.conds.map(id=>(RISK_OPTS.find(x=>x[0]===id)||[])[1]).filter(Boolean).join(", ") || "sin condiciones seleccionadas";
    const prompt=`Redacta un consentimiento informado medico-quirurgico en español de México, claro, formal y conciso. No inventes garantías. Devuelve solo JSON con keys desc, ben, alt, freq, grave, part. Paciente: ${S.f.pac}. Edad: ${edad(S.f.nac)||""}. Diagnóstico: ${b.dx}. Procedimiento: ${b.proc}. Procedimiento base: ${b.desc}. Condiciones particulares: ${conds}. Alergias: ${S.f.alergias||"no referidas"}. Observaciones: ${S.f.obsClin||"ninguna"}. Usa como base estos textos: beneficios: ${b.ben}; alternativas: ${b.alt}; riesgos frecuentes: ${b.freq}; riesgos graves: ${b.grave}.`;
    const r=await fetch("https://api.openai.com/v1/responses",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.f.apiKey},body:JSON.stringify({model:"gpt-4.1-mini",input:prompt,text:{format:{type:"json_object"}}})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error&&d.error.message?d.error.message:"No se pudo generar con IA.");
    const txt=d.output_text || (d.output&&d.output.map(o=>(o.content||[]).map(c=>c.text||"").join("")).join(""));
    S.f.consent=JSON.parse(txt);
  }catch(e){S.err="IA: "+e.message;}
  S.env=false;render();
}

async function downloadConsentPdf(){
  if(!window.PDFLib){S.err="No cargó la librería para PDF. Verifica internet e intenta de nuevo.";render();return;}
  fillEmptyConsent();
  try{
    const {PDFDocument, StandardFonts, rgb}=PDFLib;
    const bytes=await getConsentPdfBytes();
    const pdf=await PDFDocument.load(bytes);
    const font=await pdf.embedFont(StandardFonts.Helvetica);
    const italicFont=await pdf.embedFont(StandardFonts.HelveticaOblique);
    const form=pdf.getForm();
    const f=S.f, b=consentBase(), cx=fcx(), dt=cx?new Date(cx+"T12:00:00"):new Date();
    const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    const vals={Texto1:f.pac,Texto26:String(dt.getDate()),Texto2:meses[dt.getMonth()],Texto4:String(dt.getFullYear()).slice(2),Texto5:"",Texto6:"",
      Texto7:"PABLO VIDAL GONZALEZ",Texto8:b.proc,Texto23:""};
    Object.entries(vals).forEach(([k,v])=>setPdfField(form,k,v,9));
    const sections=[
      {fields:["Texto8","Texto9"],text:b.proc},
      {fields:["Texto10","Texto11","Texto12"],text:f.consent.desc},
      {fields:["Texto14","Texto13"],text:f.consent.ben},
      {fields:["Texto15","Texto16"],text:f.consent.alt},
      {fields:["Texto17","Texto18"],text:f.consent.freq},
      {fields:["Texto19","Texto20"],text:f.consent.grave},
      {fields:["Texto21","Texto22"],text:f.consent.part}
    ];
    const pdfSize=consentPdfFontSize(form,sections);
    sections.forEach(s=>fillSectionFieldsFull(form,s.fields,s.text,pdfSize));
    try{form.getCheckBox("Check Box24").check();}catch(e){}
    try{form.flatten();}catch(e){}
    await drawDoctorSignature(pdf,font,italicFont,f,rgb);
    const out=await pdf.save();
    const blob=new Blob([out],{type:"application/pdf"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`Consentimiento_${(f.pac||"paciente").replace(/[^a-z0-9áéíóúñ]+/gi,"_")}.pdf`;
    a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){S.err="PDF: "+e.message;render();}
}
function fillEmptyConsent(){if(!S.f.consent.desc)fillConsentTemplate();}
async function getConsentPdfBytes(){
  if(window.CONSENT_PDF_BASE64){
    const bin=atob(window.CONSENT_PDF_BASE64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return bytes.buffer;
  }
  return fetch("consentimiento-observatorio.pdf").then(r=>{
    if(!r.ok)throw new Error("No se pudo cargar el PDF base.");
    return r.arrayBuffer();
  });
}
function splitForPdf(text,width,size){
  const avg=size*0.52;
  const max=Math.max(18,Math.floor(width/avg));
  const words=String(text||"").replace(/\s+/g," ").trim().split(" ");
  const lines=[]; let line="";
  words.forEach(w=>{
    if(!w)return;
    const next=line?line+" "+w:w;
    if(next.length>max && line){lines.push(line);line=w;}else{line=next;}
  });
  if(line)lines.push(line);
  return lines;
}
function setPdfField(form,name,value,size){
  try{
    const field=form.getTextField(name);
    field.setText(String(value||""));
    try{field.setFontSize(size);}catch(e){}
  }catch(e){}
}
function fillPdfLines(form,names,text,size){
  const fields=names.map(name=>{
    try{
      const field=form.getTextField(name);
      const rect=field.acroField.getWidgets()[0].getRectangle();
      return {name,field,width:rect.width};
    }catch(e){return null;}
  }).filter(Boolean);
  const lines=[];
  String(text||"").split(/\n+/).forEach(part=>{
    const source=part.trim();
    if(!source)return;
    splitForPdf(source,520,size).forEach(line=>lines.push(line));
  });
  fields.forEach((item,i)=>{
    item.field.setText(lines[i]||"");
    try{item.field.setFontSize(size);}catch(e){}
  });
}
function fillSectionFields(form,names,text,size){
  const remaining=String(text||"").replace(/\s+/g," ").trim().split(" ");
  names.forEach(name=>{
    let field, width=480;
    try{
      field=form.getTextField(name);
      width=field.acroField.getWidgets()[0].getRectangle().width;
    }catch(e){return;}
    const max=Math.max(8,Math.floor(width/(size*0.49)));
    let line="";
    while(remaining.length){
      const next=line?line+" "+remaining[0]:remaining[0];
      if(next.length>max && line)break;
      line=next;
      remaining.shift();
    }
    field.setText(line);
    try{field.setFontSize(size);}catch(e){}
  });
}
function fillSectionFieldsFull(form,names,text,size){
  const remaining=String(text||"").replace(/\s+/g," ").trim().split(" ");
  names.forEach((name,index)=>{
    let field, width=480;
    try{
      field=form.getTextField(name);
      width=field.acroField.getWidgets()[0].getRectangle().width;
    }catch(e){return;}
    if(index===names.length-1){
      field.setText(remaining.join(" "));
      try{field.setFontSize(size);}catch(e){}
      return;
    }
    const max=Math.max(8,Math.floor(width/(size*0.49)));
    let line="";
    while(remaining.length){
      const next=line?line+" "+remaining[0]:remaining[0];
      if(next.length>max && line)break;
      line=next;
      remaining.shift();
    }
    field.setText(line);
    try{field.setFontSize(size);}catch(e){}
  });
}
function consentPdfFontSize(form,sections){
  let size=5.8;
  sections.forEach(section=>{
    const textLength=String(section.text||"").replace(/\s+/g," ").trim().length;
    const totalWidth=section.fields.reduce((sum,name)=>{
      try{return sum+form.getTextField(name).acroField.getWidgets()[0].getRectangle().width;}
      catch(e){return sum;}
    },0);
    if(textLength>0 && totalWidth>0){
      size=Math.min(size,totalWidth/(textLength*0.49));
    }
  });
  return Math.max(3.8,Math.min(5.8,size));
}
async function drawDoctorSignature(pdf,font,italicFont,f,rgb){
  const pages=pdf.getPages();
  if(pages.length<2)return;
  const page=pages[1];
  const name="PABLO VIDAL GONZALEZ";
  const signatureData=f.firmaData||window.DEFAULT_SIGNATURE_DATA_URL;
  if(signatureData){
    try{
      const bytes=dataUrlBytes(signatureData);
      const img=signatureData.includes("image/png")?await pdf.embedPng(bytes):await pdf.embedJpg(bytes);
      const dims=img.scale(1);
      const w=145, h=w*(dims.height/dims.width);
      page.drawImage(img,{x:375,y:180,width:w,height:Math.min(h,52)});
    }catch(e){}
  }
  page.drawText(name,{x:385,y:174,size:9.5,font,color:rgb(0,0,0)});
}
function dataUrlBytes(dataUrl){
  const b64=dataUrl.split(",")[1]||"";
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytes;
}
function addConsentAnnex(pdf,font,f,b,rgb){
  const page=pdf.addPage([612,792]);
  const margin=54, width=504;
  let y=738;
  const draw=(text,size=10,lead=14)=>{
    splitForPdf(text,width,size).forEach(line=>{
      if(y<64){ y=738; }
      page.drawText(line,{x:margin,y,size,font,color:rgb(0,0,0)});
      y-=lead;
    });
  };
  page.drawText("ANEXO DE CONSENTIMIENTO INFORMADO",{x:margin,y,size:14,font,color:rgb(0,0,0)}); y-=24;
  draw(`Paciente: ${f.pac||""}`,10); draw(`Procedimiento: ${b.proc||""}`,10); draw(`Diagnóstico: ${b.dx||""}`,10); y-=8;
  [["El procedimiento consiste en",f.consent.desc],["Beneficios",f.consent.ben],["Alternativas de tratamiento",f.consent.alt],["Riesgos típicos más frecuentes",f.consent.freq],["Riesgos graves menos frecuentes",f.consent.grave],["Riesgos particulares del paciente",f.consent.part]].forEach(([t,v])=>{
    page.drawText(t,{x:margin,y,size:11,font,color:rgb(0,0,0)}); y-=16;
    draw(v,9.5,13); y-=8;
  });
  y=Math.max(y,110);
  page.drawText("Nombre y firma del médico: PABLO VIDAL GONZALEZ",{x:margin,y,size:10,font,color:rgb(0,0,0)});
  page.drawText("Nombre y firma del paciente: "+(f.pac||""),{x:margin,y:y-22,size:10,font,color:rgb(0,0,0)});
}

async function conf(){
  S.env=true;S.err="";render();
  try{
    const f=S.f;

      paciente:f.pac,fechaNac:f.nac,telefono:f.tel,correo:f.cor,procedimiento:f.proc,hospital:f.hosp,
      fechaIngreso:f.fing,horaIngreso:f.hing,horaCirugia:f.hcx,colorCalendario:f.color,
      anestesiologo:f.anest,equipo:f.equip,insumos:f.ins,insumosExtra:f.insex})});

}

function reset(){

render();
