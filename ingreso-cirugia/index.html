<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncMed One | Indicaciones de Ingreso — Dr. Pablo Vidal González</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="syncmed-header-v3.css?v=3">

<style id="syncmed-critical-header-v4">
/* Critical inline fix: formal header */
.topbar{
  position:relative!important;
  display:grid!important;
  grid-template-columns:76px minmax(0,1fr) auto!important;
  align-items:center!important;
  gap:18px!important;
  min-height:104px!important;
  padding:18px 22px!important;
  margin:0 0 24px 0!important;
  border-radius:22px!important;
  background:#ffffff!important;
  border:1px solid rgba(18,102,255,.14)!important;
  box-shadow:0 14px 36px rgba(11,31,58,.10)!important;
  overflow:hidden!important;
  color:#0b1f3a!important;
}
.topbar:before{content:''!important;position:absolute!important;left:0!important;top:0!important;bottom:0!important;width:8px!important;background:linear-gradient(180deg,#1266ff 0%,#08c7c7 100%)!important;}
.topbar:after{content:''!important;position:absolute!important;left:0!important;top:0!important;right:0!important;height:6px!important;background:linear-gradient(90deg,#0b1f3a 0%,#1266ff 55%,#08c7c7 100%)!important;}
.brand-mark{position:relative!important;z-index:1!important;width:68px!important;height:68px!important;min-width:68px!important;border-radius:20px!important;background:linear-gradient(135deg,#fff 0%,#eef7ff 100%)!important;border:1px solid rgba(18,102,255,.16)!important;box-shadow:0 10px 24px rgba(18,102,255,.16)!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:0!important;}
.brand-mark img{width:52px!important;height:52px!important;object-fit:contain!important;display:block!important;}
.brand-copy{position:relative!important;z-index:1!important;display:flex!important;flex-direction:column!important;justify-content:center!important;min-width:0!important;}
.topbar h1{color:#0b1f3a!important;display:block!important;margin:0!important;font-size:clamp(28px,3.4vw,44px)!important;line-height:1!important;letter-spacing:-.035em!important;font-weight:850!important;text-shadow:none!important;opacity:1!important;visibility:visible!important;}
.topbar h1:before,.topbar .title:before,header h1:before,header .title:before{content:none!important;display:none!important;}
.topbar p{color:#64748b!important;margin:8px 0 0 0!important;font-size:clamp(13px,1.35vw,17px)!important;font-weight:650!important;line-height:1.2!important;opacity:1!important;visibility:visible!important;}
.brand-pill{position:relative!important;z-index:1!important;align-self:start!important;margin-top:8px!important;padding:8px 12px!important;border-radius:999px!important;background:linear-gradient(135deg,#1266ff 0%,#08c7c7 100%)!important;color:#fff!important;font-size:12px!important;font-weight:800!important;letter-spacing:.02em!important;white-space:nowrap!important;box-shadow:0 8px 20px rgba(18,102,255,.22)!important;display:block!important;}
@media(max-width:700px){.topbar{grid-template-columns:58px minmax(0,1fr)!important;gap:13px!important;min-height:92px!important;padding:16px!important}.brand-mark{width:54px!important;height:54px!important;min-width:54px!important;border-radius:16px!important}.brand-mark img{width:42px!important;height:42px!important}.brand-pill{grid-column:2!important;justify-self:start!important;margin-top:6px!important;padding:6px 10px!important;font-size:11px!important}.topbar h1{font-size:28px!important}.topbar p{font-size:13px!important;margin-top:5px!important}}
</style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-mark"><img src="assets/syncmed-one-logo.png" alt="SyncMed One"></div>
      <div class="brand-copy">
        <h1>Indicaciones de Ingreso</h1>
        <p>Dr. Pablo Vidal González · Cirugía General y Laparoscópica</p>
      </div>
      <div class="brand-pill">SyncMed One</div>
    </header>

    <section class="workspace">
      <form class="panel" id="form">
        <div class="panel-head">
          <h2>Datos para generar indicaciones</h2>
          <button type="button" class="ghost-button" id="clearButton">Limpiar</button>
        </div>

        <label class="field">
          <span>Nombre completo *</span>
          <input id="patientName" autocomplete="name" placeholder="Apellidos, Nombre" required>
        </label>

        <div class="grid two">
          <label class="field">
            <span>Fecha de nacimiento *</span>
            <input id="birthDate" type="date" required>
          </label>
          <div class="field">
            <span>Edad</span>
            <output id="ageOutput">Ingrese fecha de nacimiento</output>
          </div>
        </div>

        <label class="field">
          <span>Procedimiento quirúrgico *</span>
          <select id="procedure" required></select>
        </label>

        <label class="field" id="otherProcedureField" hidden>
          <span>Otro procedimiento *</span>
          <input id="otherProcedure" placeholder="Escriba el procedimiento quirúrgico">
        </label>

        <label class="field">
          <span>Diagnóstico de ingreso</span>
          <select id="diagnosis"></select>
        </label>

        <label class="field" id="otherDiagnosisField" hidden>
          <span>Otro diagnóstico *</span>
          <input id="otherDiagnosis" placeholder="Escriba el diagnóstico de ingreso">
        </label>

        <label class="field">
          <span>Hospital *</span>
          <select id="hospital" required></select>
        </label>

        <div class="grid two">
          <label class="field">
            <span>Fecha de ingreso *</span>
            <input id="admissionDate" type="date" required>
          </label>
          <label class="field">
            <span>Hora de ingreso *</span>
            <input id="admissionTime" type="time" value="08:00" required>
          </label>
        </div>

        <div class="grid two">
          <label class="field">
            <span>Fecha del procedimiento *</span>
            <input id="surgeryDate" type="date" required>
          </label>
          <label class="field">
            <span>Hora del procedimiento *</span>
            <input id="surgeryTime" type="time" value="11:00" required>
          </label>
        </div>

        <div class="grid two">
          <label class="field">
            <span>Fecha de inicio de ayuno</span>
            <input id="fastingDate" type="date">
          </label>
          <label class="field">
            <span>Hora de inicio de ayuno</span>
            <input id="fastingTime" type="time" value="23:30">
          </label>
        </div>

        <div class="quick-actions">
          <button type="button" class="ghost-button small-button" id="fastingPreviousButton">Ayuno día previo</button>
          <button type="button" class="ghost-button small-button" id="fastingSameDayButton">Ayuno mismo día</button>
        </div>

        <div class="grid two">
          <label class="field">
            <span>Solución al ingreso</span>
            <select id="solutionRate">
              <option value="40">Solución Hartmann a 40 ml/hora</option>
              <option value="60">Solución Hartmann a 60 ml/hora</option>
              <option value="80" selected>Solución Hartmann a 80 ml/hora</option>
              <option value="100">Solución Hartmann a 100 ml/hora</option>
              <option value="120">Solución Hartmann a 120 ml/hora</option>
            </select>
          </label>
        </div>

        <fieldset class="checks">
          <legend>Estudios al ingreso</legend>
          <label><input type="checkbox" name="studies" value="Perfil Quirurgico XIII" checked> Perfil Quirurgico XIII</label>
          <label><input type="checkbox" name="studies" value="Biometría hemática"> Biometría hemática</label>
          <label><input type="checkbox" name="studies" value="Química sanguínea"> Química sanguínea</label>
          <label><input type="checkbox" name="studies" value="Electrolitos séricos"> Electrolitos séricos</label>
          <label><input type="checkbox" name="studies" value="Pruebas de función hepática"> Pruebas de función hepática</label>
          <label><input type="checkbox" name="studies" value="Amilasa y lipasa"> Amilasa y lipasa</label>
          <label><input type="checkbox" name="studies" value="Coagulograma"> Coagulograma</label>
          <label><input type="checkbox" name="studies" value="Tele de Tórax"> Tele de Tórax</label>
          <label><input type="checkbox" name="studies" value="Electrocardiograma"> Electrocardiograma</label>
        </fieldset>

        <fieldset class="checks">
          <legend>Interconsultas</legend>
          <label><input type="checkbox" name="interconsultations" value="Dr. Fernando Magaña"> Dr. Fernando Magaña</label>
          <label><input type="checkbox" name="interconsultations" value="Dr. Omar Fueyo"> Dr. Omar Fueyo</label>
          <label><input type="checkbox" name="interconsultations" value="Lic. Marcela Sawaya"> Lic. Marcela Sawaya</label>
          <label><input type="checkbox" name="interconsultations" value="Dr. Jorge Guajardo"> Dr. Jorge Guajardo</label>
          <label><input type="checkbox" name="interconsultations" value="Dr. Jon Mikel Iñarritu"> Dr. Jon Mikel Iñarritu</label>
          <label><input type="checkbox" name="interconsultations" value="Dra. Ana María Serrano"> Dra. Ana María Serrano</label>
          <label><input type="checkbox" id="otherInterconsultationCheck"> Otro</label>
          <input id="otherInterconsultation" class="inline-extra" placeholder="Nombre de interconsulta" hidden>
        </fieldset>

        <label class="field">
          <span>Indicaciones adicionales</span>
          <textarea id="extraNotes" rows="3" placeholder="Ej. reservar hemoderivados, valoración específica, traer estudios previos"></textarea>
        </label>
      </form>

      <section class="preview-panel">
        <div class="toolbar no-print">
          <button type="button" id="copyButton">Copiar texto</button>
          <button type="button" id="downloadPdfButton">Descargar PDF</button>
          <button type="button" id="sharePdfButton">WhatsApp / compartir</button>
          <button type="button" id="emailPdfButton">Correo PDF</button>
          <button type="button" id="printButton">Imprimir</button>
        </div>
        <article class="document" id="documentPreview"></article>
      </section>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
