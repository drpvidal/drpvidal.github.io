<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SyncMed One | Receta Libre</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(160deg,#f5f0ff,#fff 58%,#eef7ff);min-height:100vh;color:#152033;padding:16px}
.wrap{max-width:840px;margin:0 auto}.header{background:linear-gradient(135deg,#2e1065,#7c3aed 58%,#a855f7);border-radius:22px;padding:22px;display:flex;gap:15px;align-items:center;color:#fff;box-shadow:0 18px 44px rgba(124,58,237,.24);margin-bottom:18px}.logo{width:58px;height:58px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}.logo img{width:42px;height:42px;object-fit:contain}h1{font-size:26px;line-height:1.05;font-weight:800}.sub{font-size:13px;opacity:.9;margin-top:5px}
.card{background:#fff;border:1.5px solid #ddd6fe;border-radius:18px;padding:20px;box-shadow:0 10px 32px rgba(46,16,101,.08);margin-bottom:16px}.card h2{font-size:17px;color:#2e1065;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg{margin-bottom:14px}label{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:#7c3aed;margin-bottom:6px}input,textarea{width:100%;border:1.5px solid #ddd6fe;border-radius:12px;padding:12px 13px;font-size:16px;background:#fbfaff;color:#152033;outline:none;font-family:Arial,sans-serif}textarea{min-height:115px;resize:vertical;line-height:1.45}.age{background:#f5f0ff;color:#2e1065;font-weight:800;min-height:48px;display:flex;align-items:center;border:1.5px solid #ddd6fe;border-radius:12px;padding:12px 13px}.hint{font-size:12px;color:#64748b;margin-top:5px}.mini-btn{margin-top:8px;border:1.5px solid #7c3aed;background:#fff;color:#7c3aed;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{flex:1;min-width:170px;border:none;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-size:16px;font-weight:800;padding:14px 18px;cursor:pointer;box-shadow:0 10px 22px rgba(124,58,237,.18)}.btn.sec{background:#fff;color:#7c3aed;border:1.5px solid #7c3aed;box-shadow:none}.status{font-size:14px;font-weight:700;margin-top:12px;min-height:22px;color:#15803d}
.rx-wrap{overflow:auto}.receta-page{position:relative;width:610px;height:513px;background:#fff;overflow:hidden;font-family:Arial,sans-serif;color:#111;box-shadow:0 0 0 1px #dbe4ef;margin:0 auto}.receta-page .hdr{position:absolute;left:0;top:0;width:610px}.receta-page .ftr{position:absolute;left:0;bottom:0;width:610px}.receta-page .date{position:absolute;right:42px;top:108px;width:280px;text-align:right;font-size:10px}.receta-page .body{position:absolute;left:42px;right:42px;top:126px;bottom:92px;font-size:10.2px;line-height:1.32}.blue{color:#365F91;font-weight:800}.row{margin:3px 0}.texto{white-space:pre-wrap;font-size:10.4px;line-height:1.38}.texto.libre{margin-top:16px}.texto.meds{margin-top:16px}.texto.meds .primera{color:#365F91;font-weight:800;text-decoration:underline}.receta-page .firma{position:absolute;left:390px;bottom:90px;width:120px}.receta-page .doctor{position:absolute;left:355px;bottom:74px;width:190px;text-align:center;color:#365F91;font-size:8.2px;font-weight:800}#pdfCard{display:none}.pdf-frame{width:100%;height:680px;border:1px solid #ddd6fe;border-radius:14px;background:#fff}@media(max-width:660px){.grid{grid-template-columns:1fr}.actions{display:block}.btn{width:100%;margin-bottom:10px}.receta-page{transform-origin:top left}}
</style>
<!-- receta-libre-estable-jsPDF-directo-v1 -->
</head>
<body>
<div class="wrap">
  <div class="header"><div class="logo"><img src="assets/syncmed-one-logo.png" alt="SyncMed One"></div><div><h1>Receta Libre</h1><div class="sub">SyncMed One · Dr. Pablo Vidal González</div></div></div>
  <div class="card"><h2>Datos de la receta</h2>
    <div class="fg"><label>Nombre completo</label><input id="nombre" placeholder="Nombre Apellidos" autocomplete="off" autocapitalize="words" oninput="preview()"></div>
    <div class="grid"><div class="fg"><label>Fecha de nacimiento</label><input id="fn" type="date" oninput="actualizarEdad();preview()" onchange="actualizarEdad();preview()"></div><div class="fg"><label>Edad automática</label><div id="edadBox" class="age">Ingrese fecha de nacimiento</div></div></div>
    <div class="fg"><label>Fecha de receta</label><input id="fecha" type="date" oninput="preview()"></div>
    <div class="fg"><label>1A. Texto libre / carta / estudio</label><textarea id="libre" placeholder="Ej. A quien corresponda:\nPor medio de la presente solicito / indico / hago constar..." oninput="preview()"></textarea><div class="hint">Opcional. Para cartas, solicitudes o indicaciones libres.</div></div>
    <div class="fg"><label>1B. Medicamentos / receta</label><textarea id="texto" placeholder="Ej. Escribe/dicta: Biomics cefixima 400 mg tomar una cápsula cada 24 horas por 6 días..." oninput="preview()"></textarea><button type="button" class="mini-btn" onclick="formatearMedicamentoIA()">Dar formato con IA</button><div class="hint">La IA acomoda el texto; no debe cambiar dosis ni indicaciones.</div></div>
    <div class="fg"><label>1C. Texto libre después de medicamentos</label><textarea id="libre2" placeholder="Ej. Indicaciones adicionales, cuidados especiales, solicitar estudio posterior..." oninput="preview()"></textarea><div class="hint">Opcional. Se imprime debajo de los medicamentos.</div></div>
  </div>
  <div class="card"><h2>Vista previa</h2><div class="rx-wrap" id="preview"></div></div>
  <div class="actions"><button class="btn sec" onclick="verPDF()">Ver PDF</button><button class="btn sec" onclick="descargarPDF()">Descargar PDF</button><button class="btn sec" onclick="compartirPDF()">Compartir PDF</button></div>
  <div id="status" class="status"></div>
  <div class="card" id="pdfCard"><h2>PDF generado</h2><button class="btn sec" onclick="compartirPDF()" style="width:100%;margin-bottom:10px">Compartir este PDF</button><iframe id="pdfViewer" class="pdf-frame"></iframe></div>
</div>
<script>
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];let ultimoPDF=null;let ultimoUrl=null;let cacheImgs={};
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoy(){return iso(new Date())}
function fechaLarga(v){if(!v)return'';const[y,m,d]=v.split('-');return parseInt(d)+' de '+MESES[parseInt(m)-1]+' de '+y}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function edad(){const v=document.getElementById('fn').value;if(!v)return'';const h=new Date(),b=new Date(v+'T12:00:00');let e=h.getFullYear()-b.getFullYear();const m=h.getMonth()-b.getMonth();if(m<0||(m===0&&h.getDate()<b.getDate()))e--;return e}
function actualizarEdad(){const e=edad();document.getElementById('edadBox').textContent=e!==''?e+' años':'Ingrese fecha de nacimiento'}
function datos(){return{nombre:document.getElementById('nombre').value.trim(),fn:document.getElementById('fn').value,edad:edad(),fecha:document.getElementById('fecha').value,libre:document.getElementById('libre').value.trim(),texto:document.getElementById('texto').value.trim(),libre2:document.getElementById('libre2').value.trim()}}
function textoLibreFormato(t){return esc(t||'')}
function textoMedicamentoFormato(t){const lineas=String(t||'').split('\n');if(!lineas.length)return'';return lineas.map((l,i)=>i===0?`<span class="primera">${esc(l)}</span>`:esc(l)).join('\n')}
function buildRecetaHTML(d){const libre=d.libre?`<div class="texto libre">${textoLibreFormato(d.libre)}</div>`:'';const meds=d.texto?`<div class="texto meds">${textoMedicamentoFormato(d.texto)}</div>`:'';const libre2=d.libre2?`<div class="texto libre">${textoLibreFormato(d.libre2)}</div>`:'';return `<div class="receta-page"><img class="hdr" src="assets/header.jpg"><img class="ftr" src="assets/footer.jpg"><div class="date">CDMX a ${esc(fechaLarga(d.fecha)||'')}</div><div class="body"><div class="row"><span class="blue">Paciente:</span> <b>${esc((d.nombre||'-').toUpperCase())}</b></div><div class="row"><span class="blue">Edad:</span> ${d.edad?esc(d.edad)+' años':'-'} &nbsp;&nbsp;&nbsp; <span class="blue">FN:</span> ${esc(d.fn||'-')}</div>${libre}${meds}${libre2}</div><img class="firma" src="assets/firma.png"><div class="doctor">DR. PABLO VIDAL GONZÁLEZ</div></div>`}
function preview(){document.getElementById('preview').innerHTML=buildRecetaHTML(datos())}
function validar(d){if(!d.fecha)return'Falta fecha.';if(!d.libre&&!d.texto&&!d.libre2)return'Falta texto libre o medicamento.';return''}
function status(t){document.getElementById('status').textContent=t||''}
function fallbackFormatoMedicamento(t){t=String(t||'').trim();if(!t)return'';if(/^\s*\d+\.-/.test(t)&&t.includes('\n'))return t;const limpio=t.replace(/\s+/g,' ').trim();const m=limpio.match(/^(.*?)(\bTomar\b|\btomar\b|\bAplicar\b|\baplicar\b|\bUsar\b|\busar\b)(.*)$/);if(m){const nombre=m[1].trim().replace(/[.,;:]$/,'');const instr=(m[2]+m[3]).trim();return '1.- '+nombre.toUpperCase()+'.\n'+instr.charAt(0).toUpperCase()+instr.slice(1)}return '1.- '+limpio}
async function formatearMedicamentoIA(){const ta=document.getElementById('texto');const crudo=ta.value.trim();if(!crudo){status('Escribe o dicta el medicamento primero.');return}status('Dando formato con IA...');const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),7000);try{const r=await fetch('/api/formatear-receta-libre',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:crudo}),signal:ctrl.signal});clearTimeout(timer);const data=await r.json();ta.value=(data.texto||'').trim()||fallbackFormatoMedicamento(crudo);preview();status('Medicamento con formato. Revisa antes de generar PDF.')}catch(e){clearTimeout(timer);ta.value=fallbackFormatoMedicamento(crudo);preview();status('La IA tardó; apliqué formato automático local. Revisa antes de generar PDF.')}}
async function imgData(src){if(cacheImgs[src])return cacheImgs[src];const r=await fetch(src);const blob=await r.blob();const data=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob)});cacheImgs[src]=data;return data}
function splitText(pdf,text,w){return pdf.splitTextToSize(String(text||''),w)}
function addLines(pdf,lines,x,y,lh){for(const line of lines){pdf.text(line,x,y);y+=lh}return y}
async function crearPDF(){const d=datos();const err=validar(d);if(err){status(err);return null}status('Generando PDF...');const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:[215,181],orientation:'landscape'});try{const [hdr,ftr,firma]=await Promise.all([imgData('assets/header.jpg'),imgData('assets/footer.jpg'),imgData('assets/firma.png')]);pdf.addImage(hdr,'JPEG',0,0,215,0);pdf.addImage(ftr,'JPEG',0,161,215,20);pdf.addImage(firma,'PNG',138,132,44,0)}catch(e){}
pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(0,0,0);pdf.text('CDMX a '+fechaLarga(d.fecha),198,42,{align:'right'});
let x=16,y=50,w=180,lh=5;pdf.setFontSize(8);pdf.setFont('helvetica','bold');pdf.setTextColor(54,95,145);pdf.text('Paciente:',x,y);pdf.setTextColor(0,0,0);pdf.text((d.nombre||'-').toUpperCase(),x+15,y);y+=5;pdf.setTextColor(54,95,145);pdf.text('Edad:',x,y);pdf.setFont('helvetica','normal');pdf.setTextColor(0,0,0);pdf.text(d.edad?d.edad+' años':'-',x+10,y);pdf.setFont('helvetica','bold');pdf.setTextColor(54,95,145);pdf.text('FN:',x+45,y);pdf.setFont('helvetica','normal');pdf.setTextColor(0,0,0);pdf.text(d.fn||'-',x+52,y);y+=8;
if(d.libre){pdf.setFont('helvetica','normal');pdf.setTextColor(0,0,0);pdf.setFontSize(9);y=addLines(pdf,splitText(pdf,d.libre,w),x,y,lh);y+=4}
if(d.texto){const parts=String(d.texto).split('\n');pdf.setFontSize(9);pdf.setTextColor(54,95,145);pdf.setFont('helvetica','bold');let first=parts.shift()||'';y=addLines(pdf,splitText(pdf,first,w),x,y,lh);pdf.setFont('helvetica','normal');pdf.setTextColor(0,0,0);for(const block of parts.join('\n').split('\n')){y=addLines(pdf,splitText(pdf,block,w),x+8,y,lh)}y+=4}
if(d.libre2){pdf.setFont('helvetica','normal');pdf.setTextColor(0,0,0);pdf.setFontSize(9);y=addLines(pdf,splitText(pdf,d.libre2,w),x,y,lh)}
pdf.setFont('helvetica','bold');pdf.setFontSize(8);pdf.setTextColor(54,95,145);pdf.text('DR. PABLO VIDAL GONZÁLEZ',160,154,{align:'center'});
const blob=pdf.output('blob');ultimoPDF=blob;return blob}
async function verPDF(){const blob=await crearPDF();if(!blob)return;if(ultimoUrl)URL.revokeObjectURL(ultimoUrl);ultimoUrl=URL.createObjectURL(blob);document.getElementById('pdfViewer').src=ultimoUrl+'#view=FitH';document.getElementById('pdfCard').style.display='block';document.getElementById('pdfCard').scrollIntoView({behavior:'smooth',block:'start'});status('PDF generado.')}
async function descargarPDF(){const blob=await crearPDF();if(!blob)return;const d=datos();const nombre='Receta_'+(d.nombre?d.nombre.replace(/\s+/g,'_'):'Libre')+'.pdf';const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=nombre;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),60000);status('PDF descargado.')}
async function compartirPDF(){const blob=ultimoPDF||await crearPDF();if(!blob)return;const d=datos();const file=new File([blob],'Receta_'+(d.nombre?d.nombre.replace(/\s+/g,'_'):'Libre')+'.pdf',{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:file.name,text:'Receta médica'});status('PDF listo para compartir.')}else{await descargarPDF();status('Este navegador no permite compartir directo; descargué el PDF.')}}
document.getElementById('fecha').value=hoy();actualizarEdad();preview();
</script>
</body>
</html>
